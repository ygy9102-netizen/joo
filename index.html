  var ss=r.sents.map(function(id){return BYID[id];}).filter(Boolean), ws=r.words.map(function(id){return BYID[id];}).filter(Boolean);
  var anyX=function(a){ return a.some(isX); };
  if(ss.length) h+='<div class="sect-title">'+(anyX(ss)?'다음에 써 보면 좋은 문장 · 📘 교재 · 💡 연구 표현':'📘 다음에 써 보면 좋은 교재 문장')+'</div><div class="list">'+ss.map(function(c){return itemRow(c,true);}).join('')+'</div>';
  if(ws.length) h+='<div class="sect-title">'+(anyX(ws)?'익혀 두면 좋은 단어 · 📘 교재 · 💡 연구':'📘 익혀 두면 좋은 단어')+'</div><div class="list">'+ws.map(function(c){ return itemRow(c,true).replace('<span class="meta">', (c.ch>it.upto && !isX(c))?'<span class="meta"><span class="chip rv">미리보기</span>':'<span class="meta">'); }).join('')+'</div>';
  if(r.extra.length){
    h+='<div class="sect-title">💡 교재 밖 표현 · AI 제안</div><div class="stack" style="gap:10px">';
    r.extra.forEach(function(x){ var m=tbMatch(x.vi); h+='<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="vi" style="font-size:17px;font-weight:600">'+toneHTML(x.vi)+'</div><button class="speak sm" data-speak="'+esc(x.vi)+'" aria-label="듣기">'+ICON.speak+'</button></div><div>'+esc(x.ko)+'</div>'+(x.why?'<div class="muted" style="font-size:13.5px">'+esc(x.why)+'</div>':'')+'<div style="margin-top:6px">'+srcBadge(x.vi)+'</div></div>'; });
    h+='</div>';
  }
  if(r.next) h+='<div class="sect-title">다음 연습</div><div class="tip">'+esc(r.next)+'</div>';
  h+='<details style="margin-top:16px"><summary>대화 다시 보기</summary><div class="tk-chat" style="padding-top:10px">'+it.turns.map(function(t,i){ return t.r==='me' ? '<div class="tk-msg me"><div class="tk-bub"><div class="tk-vi">'+esc(t.t)+'</div></div></div>' : '<div class="tk-msg ai"><div class="tk-who">'+esc(tkName(it))+'</div><div class="tk-bub"><div class="tk-vi">'+tkViHTML(t.vi, it)+'</div>'+(t.ko?'<div class="tk-ko">'+esc(t.ko)+'</div>':'')+'</div></div>'; }).join('')+'</div></details>';
  h+='</div></div><div class="sheet-foot"><div class="actions">'+
    ((ss.length||ws.length)?'<button class="btn primary" data-act="talk-study">추천 카드 공부 ('+(ss.length+ws.length)+')</button>':'')+
    '<button class="btn" data-act="talk-again">같은 설정으로 다시</button></div></div></div>';
  return h;
}
function tkStudy(){
  var it=tkHist(TK.open); if(!it) return;
  var cards=it.report.sents.concat(it.report.words).map(function(id){return BYID[id];}).filter(Boolean);
  closeSheet(); startStudy(uniqByKey(cards), '프리토킹 추천');
}
function tkAgain(){
  var it=tkHist(TK.open); if(!it) return;
  ['topic','partner','addr','mode','tier','ko'].forEach(function(k){ if(it[k]) TK.pref[k]=it[k]; });
  if(it.upto && it.upto!==state.settings.upto){ state.settings.upto=it.upto; gameSel=null; save(); }
  closeSheet(); tkStart();
}
/* keep the composer above the on-screen keyboard (iOS) */
function tkVV(){
  var sh=document.querySelector('.sheet.talk'); if(!sh || !window.visualViewport) return;
  var vv=window.visualViewport; sh.style.top=vv.offsetTop+'px'; sh.style.height=vv.height+'px'; sh.style.bottom='auto';
}
if(window.visualViewport){ try{ window.visualViewport.addEventListener('resize', tkVV); window.visualViewport.addEventListener('scroll', tkVV); }catch(e){} }

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t=e.target.closest('button, [data-open]'); if(!t) return;
  var a;
  if((a=t.getAttribute('data-speak'))!==null){ e.stopPropagation(); speak(a); return; }
  if((a=t.getAttribute('data-tab'))){ if(view.sheet) closeSheet(); setTab(a); return; }
  if((a=t.getAttribute('data-ch'))){ view.tab='chapters'; view.ch=+a; view.deck=+a===1?'pic':'box'; view.filter='all'; view.sfilter='tb'; view.shown={}; view.open=null;
    Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function(b){ if(b.getAttribute('data-tab')==='chapters') b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    render(); window.scrollTo(0,0); return; }
  if((a=t.getAttribute('data-deck'))){ view.deck=a; view.open=null; render(); return; }
  if((a=t.getAttribute('data-filter'))){ view.filter=a; view.open=null; render(); return; }
  if((a=t.getAttribute('data-sfilter'))){ view.sfilter=a; view.open=null; render(); return; }
  if((a=t.getAttribute('data-dhide'))){ view.dhide=a; view.shown={}; render(); return; }
  if((a=t.getAttribute('data-role'))){ view.role[a]=t.getAttribute('data-val'); view.shown={}; render(); return; }
  if((a=t.getAttribute('data-peek'))){ view.shown[a]=1; render(); var l=BYID[a]; if(l && view.dhide!=='ko') speak(sayText(l)); return; }
  if((a=t.getAttribute('data-playdlg'))){ var dd=BYID[a]; if(dd) speakSeq(dd.lines.filter(function(l){return !l.dir;}).map(function(l){return {id:l.id, text:sayText(l)};})); return; }
  if((a=t.getAttribute('data-tile'))!==null){ tapTile(+a); return; }
  if((a=t.getAttribute('data-ttopic'))){ TK.pref.topic=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-tpartner'))){ TK.pref.partner=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-taddr'))){ TK.pref.addr=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-tmode'))){ TK.pref.mode=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-ttier'))){ TK.pref.tier=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-tko'))){ TK.pref.ko=a; tkSave(); render(); return; }
  if((a=t.getAttribute('data-tkko'))!==null){ TK.koOpen[a]=!TK.koOpen[a]; tkUpdate(false); return; }
  if((a=t.getAttribute('data-tkwords'))!==null){ TK.wOpen[a]=!TK.wOpen[a]; tkUpdate(false); if(TK.wOpen[a]){ var wl=document.querySelectorAll('#tk-list .tk-msg')[+a]; var ww=wl&&wl.querySelector('.tk-words'); if(ww&&ww.scrollIntoView) ww.scrollIntoView({block:'nearest'}); } return; }
  if((a=t.getAttribute('data-tkuse'))!==null){ tkUseHint(+a); return; }
  if((a=t.getAttribute('data-talkopen'))){ TK.open=a; TK.view='report'; openSheet('talk'); return; }
  if((a=t.getAttribute('data-open'))){ view.open = view.open===a?null:a; if(view.sheet){ var sb0=sheetRoot.querySelector('.sheet-body'), st0=sb0?sb0.scrollTop:0; renderSheet(); var sb1=sheetRoot.querySelector('.sheet-body'); if(sb1) sb1.scrollTop=st0; } else if(view.tab==='chapters' && !view.ch && view.q.trim()){ var box=document.getElementById('search-results'); if(box) box.innerHTML=renderSearch(view.q.trim()); } else render(); return; }
  if((a=t.getAttribute('data-study'))){ var cards=filterCards(deckCards(+a, view.deck)), cxs=!!chInfo(+a).x; startStudy(uniqByKey(cards), a+'과 '+({box:'단어',table:'표 어휘',sent:cxs?'연구 표현':({tb:'교재 문장',core:'핵심 문장',made:'만든 예문'})[view.sfilter],dlg:cxs?'가상 회화':'회화',pic:'그림 단어'})[view.deck]); return; }
  if((a=t.getAttribute('data-game'))){ var g=t.getAttribute('data-gch'); var chs=g?[+g]:gameRange().slice(); if(view.sheet) { sheetRoot.innerHTML=''; view.sheet=null; } startQuiz(a, chs); return; }
  if((a=t.getAttribute('data-gsel'))){ var n=+a, sel=gameRange(), i=sel.indexOf(n); if(i>=0){ if(sel.length>1) sel.splice(i,1); } else sel.push(n); sel.sort(function(x,y){return x-y;}); render(); return; }
  if((a=t.getAttribute('data-grade'))){ doGrade(+a); return; }
  if((a=t.getAttribute('data-ans'))){ answer(+a); return; }
  if((a=t.getAttribute('data-mission'))){ state.missions[a]=!state.missions[a]; save(); render(); return; }
  if((a=t.getAttribute('data-set'))){ var key=a, val=t.getAttribute('data-val'), s=state.settings;
    if(key==='upto'||key==='newPerDay') s[key]=+val; else if(key==='rate') s[key]=+val; else if(val==='true'||val==='false') s[key]=(val==='true'); else s[key]=val;
    if(key==='upto'){ gameSel=null; state.seenIntro=true; }
    save(); renderSheet(); render(); return; }
  switch(t.getAttribute('data-act')){
    case 'settings': openSheet('settings'); break;
    case 'close': closeSheet(); break;
    case 'intro-ok': state.seenIntro=true; save(); render(); break;
    case 'back': view.ch=null; view.open=null; render(); window.scrollTo(0,0); break;
    case 'daily': var q=dailyQueue(); startStudy(q.due.concat(q.fresh), '오늘의 카드'); break;
    case 'more': var q2=dailyQueue(5); startStudy(q2.fresh.slice(-5).length?q2.fresh.slice(-5):q2.fresh, '새 단어 더'); break;
    case 'flip': flipCard(); break;
    case 'memo': var mb=document.getElementById('memo-box'); if(mb){ mb.hidden=!mb.hidden; if(!mb.hidden) document.getElementById('memo-input').focus(); } break;
    case 'memo-save': var mi=document.getElementById('memo-input'); var c=curCard(); if(c){ var v=mi.value.trim(); if(v) state.memo[pkey(c)]=v; else delete state.memo[pkey(c)]; save(); toast('메모를 저장했어요'); renderSheet(); } break;
    case 'next': nextQ(); break;
    case 'tile-hint': tileHint(); break;
    case 'talk-start': tkStart(); break;
    case 'talk-mic': sttToggle(); break;
    case 'toggle-api-box': TK.showApiBox=!TK.showApiBox; render(); break;
    case 'save-gem-key': var gki=document.getElementById('gem-key-input'); if(gki){ setGemKey(gki.value); TK.showApiBox=false; toast(getGemKey()?'Gemini API 키를 저장했어요!':'오프라인 기본 튜터 모드로 전환했어요'); render(); } break;
    case 'clear-gem-key': setGemKey(''); TK.showApiBox=false; toast('API 키를 지웠어요'); render(); break;
    case 'talk-send': tkSend(); break;
    case 'talk-hint': tkHint(); break;
    case 'talk-hint-close': TK.hints=null; tkUpdate(false); break;
    case 'talk-end': tkEvaluate(); break;
    case 'talk-stop': if(TK.ctl){ try{ TK.ctl.abort(); }catch(e){} } break;
    case 'talk-retry': tkAsk(); break;
    case 'talk-resume': if(TK.cur){ TK.view='chat'; TK.hints=null; openSheet('talk'); tkScroll(); } break;
    case 'talk-discard': TK.cur=null; tkSave(); render(); break;
    case 'talk-study': tkStudy(); break;
    case 'talk-again': tkAgain(); break;
    case 'talk-clear1': var tc0=document.getElementById('tk-clear'); if(tc0) tc0.innerHTML='<div class="row" style="flex-wrap:wrap"><span class="muted" style="font-size:13px">이 기기의 지난 대화와 평가가 모두 지워져요.</span><button class="btn small" data-act="talk-clear2" style="border-color:var(--lacquer);color:var(--lacquer)">정말 지우기</button><button class="btn small ghost" data-act="talk-clear0">취소</button></div>'; break;
    case 'talk-clear0': render(); break;
    case 'talk-clear2': TK.hist=[]; tkSave(); toast('지난 대화를 지웠어요'); render(); break;
    case 'again': var m=quiz.mode, cs=quiz.chs; closeSheet(); startQuiz(m, cs); break;
    case 'study-wrong': var wr=uniqByKey(quiz.wrong); closeSheet(); startStudy(wr, '틀린 카드'); break;
    case 'export': exportCode(); break;
    case 'vcheck': runVoiceCheck(); break;
    case 'vhelp-close': var vh=document.getElementById('voice-help'); if(vh) vh.remove(); break;
    case 'import': importCode(); break;
    case 'reset1': document.getElementById('reset-zone').innerHTML='<div class="row" style="flex-wrap:wrap"><span class="muted" style="font-size:13px">이 기기의 학습 기록이 모두 지워져요.</span><button class="btn small" data-act="reset2" style="border-color:var(--lacquer);color:var(--lacquer)">정말 지우기</button><button class="btn small ghost" data-act="reset0">취소</button></div>'; break;
    case 'reset0': renderSheet(); break;
    case 'reset2': var keep=state.settings; state=clone(DEFAULTS); state.settings=keep; state.seenIntro=true; save(); toast('학습 기록을 지웠어요'); renderSheet(); render(); break;
  }
});
document.addEventListener('click', function(e){ var f=e.target.closest('#flash'); if(f && sess && !sess.flipped && !e.target.closest('button')) flipCard(); });
document.addEventListener('keydown', function(e){
  if(e.target && e.target.id==='tk-input' && e.key==='Enter' && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); tkSend(); return; }
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var o=e.target.closest && e.target.closest('[data-open]'); if(o && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); o.click(); return; }
  if(view.sheet==='study' && sess && sess.i<sess.cards.length){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipCard(); }
    else if(sess.flipped && (e.key==='1'||e.key==='2'||e.key==='3')) doGrade(+e.key-1);
    else if(e.key==='p') speak(sayText(curCard()));
  } else if(view.sheet==='quiz' && quiz && !quiz.over){
    if(/^[1-4]$/.test(e.key) && quiz.mode!=='build') answer(+e.key-1); else if(e.key==='Enter' && quiz.answered!==null) nextQ();
  }
  if(e.key==='Escape' && view.sheet) closeSheet();
});
document.addEventListener('input', function(e){
  if(e.target.id==='tk-input'){ TK.draft=e.target.value; tkGrow(e.target); return; }
  if(e.target.id==='search'){ view.q=e.target.value; view.open=null; var box=document.getElementById('search-results'); if(box) box.innerHTML = view.q.trim()?renderSearch(view.q.trim()):chList()+footer(); }
});
document.addEventListener('change', function(e){
  if(e.target.id==='voice-sel'){ state.settings.voice=e.target.value; save(); refreshVoices(); speak('Xin chào'); }
});
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ rollDay(); if(!view.sheet) render(); } });

render();
setTimeout(function(){ SP.checked=true; if(SP.ok) refreshVoices(); if(view.tab==='home' && !view.sheet && (!SP.ok || !viVoices().length)) render(); }, 1600);
})();
