<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghe Nói A1 단어카드</title>
<meta name="description" content="Tiếng Việt Nghe Nói A1 교재 1~13과 단어·표 어휘·문장·예문·회화 카드, 배운 단어로 만든 예문, 연구 현장 베트남어(14~16과, 교재 외)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column of index cards on celadon paper; tab bar pinned to the bottom; study and games open as full-screen sheets */
:root{
  --paper:#EEF3EF; --card:#FFFFFF; --sunk:#E3EBE5; --ink:#18221E; --ink2:#53625A; --ink3:#7A8880; --line:#D3DDD6;
  --jade:#12735E; --jade-soft:#D5ECE4; --on-jade:#FFFFFF; --lacquer:#B8372A; --lacquer-soft:#F6DEDA; --ochre:#9A6500; --ochre-soft:#F5E7C8; --good:#1D7A43; --good-soft:#D8EEDF;
  --t-ngang:#3F68A6; --t-sac:#C93A25; --t-huyen:#6447B0; --t-hoi:#946100; --t-nga:#B02E73; --t-nang:#2B7A31;
  --f-vi:"Be Vietnam Pro","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px; --shadow:0 1px 0 rgba(24,34,30,.06),0 6px 18px -10px rgba(24,34,30,.25);
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --card:#18211D; --sunk:#202B26; --ink:#E6EEE9; --ink2:#A6B5AD; --ink3:#7F8F87; --line:#2B3832;
  --jade:#46C3A0; --jade-soft:#173A31; --on-jade:#0A1411; --lacquer:#F0806F; --lacquer-soft:#3A1E1A; --ochre:#E6B252; --ochre-soft:#382B12; --good:#5CCB8A; --good-soft:#163323;
  --t-ngang:#93B4EA; --t-sac:#FF8B75; --t-huyen:#B9A2F5; --t-hoi:#EDBD55; --t-nga:#F38FC5; --t-nang:#84D18A;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1513; --card:#18211D; --sunk:#202B26; --ink:#E6EEE9; --ink2:#A6B5AD; --ink3:#7F8F87; --line:#2B3832;
  --jade:#46C3A0; --jade-soft:#173A31; --on-jade:#0A1411; --lacquer:#F0806F; --lacquer-soft:#3A1E1A; --ochre:#E6B252; --ochre-soft:#382B12; --good:#5CCB8A; --good-soft:#163323;
  --t-ngang:#93B4EA; --t-sac:#FF8B75; --t-huyen:#B9A2F5; --t-hoi:#EDBD55; --t-nga:#F38FC5; --t-nang:#84D18A;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ko);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px;border-radius:8px}
.vi{font-family:var(--f-vi);letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.sect-title{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink2);margin:22px 2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:0 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.chip.page{font-family:var(--f-vi);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.chip.rv{background:var(--jade-soft);color:var(--jade)}
.chip.hm{background:var(--ochre-soft);color:var(--ochre)}
.chip.diff{background:var(--lacquer-soft);color:var(--lacquer)}
.seal{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:5px;border:1.5px solid var(--lacquer);color:var(--lacquer);font-size:12px;font-weight:700;line-height:1;font-family:"Noto Serif KR","Apple SD Gothic Neo",serif}
/* tones */
.t-ngang{color:var(--t-ngang)} .t-sac{color:var(--t-sac)} .t-huyen{color:var(--t-huyen)} .t-hoi{color:var(--t-hoi)} .t-nga{color:var(--t-nga)} .t-nang{color:var(--t-nang)}
body.notone .t{color:inherit}
.contour{width:22px;height:16px;flex:none}
.contour path,.contour line{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.contour circle{fill:currentColor}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--f-vi);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{font-size:12.5px;color:var(--ink2);margin-top:3px}
.ma-strip{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.ma-strip button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px 5px;display:flex;flex-direction:column;align-items:center;min-width:46px}
.ma-strip .vi{font-size:21px;font-weight:700;line-height:1.1}
.ma-strip small{font-size:10.5px;color:var(--ink3)}
/* home */
.today{display:grid;gap:14px}
.today .big{font-family:var(--f-vi);font-size:46px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.today .split{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2)}
.today .split b{color:var(--ink);font-variant-numeric:tabular-nums}
.streak{display:flex;gap:8px;flex-wrap:wrap}
.banner{background:var(--jade-soft);border:1px solid transparent;border-radius:var(--r-md);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:13px 14px;min-height:76px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.quick b{font-size:15px}
.quick span{font-size:12.5px;color:var(--ink2);line-height:1.35}
.chlist{display:flex;flex-direction:column;gap:8px}
.chrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:11px 12px;text-align:left;width:100%}
.chnum{font-family:var(--f-vi);font-weight:800;font-size:20px;text-align:center;color:var(--jade)}
.chrow .ttl{font-family:var(--f-vi);font-weight:600;font-size:15px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.chrow .sub{font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.bar .k{background:var(--jade)} .bar .l{background:var(--ochre)}
.locked{opacity:.55}
.tip{border-left:3px solid var(--ochre);padding:10px 12px;background:var(--card);border-radius:0 var(--r-md) var(--r-md) 0;font-size:14px}
/* chapter detail */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);padding:8px 0;font-weight:600}
.chhead h2{font-family:var(--f-vi);font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;min-height:38px;padding:0 12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--ink2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item .w{font-family:var(--f-vi);font-weight:600;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
.item .m{grid-column:1/-1;color:var(--ink2);font-size:14px;overflow-wrap:anywhere}
.item .meta{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.item .box{width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:8px}
.item .box.b1{background:var(--lacquer)} .item .box.b2{background:var(--ochre)} .item .box.b3,.item .box.b4{background:var(--jade)} .item .box.b5{background:var(--good)}
.item.sent .w{font-size:16.5px;font-weight:500}
.secname{padding:10px 14px 6px;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.04em;background:var(--sunk);border-top:1px solid var(--line)}
.secname:first-child{border-top:0}
.detail{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13.5px}
.search{width:100%;min-height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 18px;font-size:15px}
/* guide */
.guide h3{font-size:18px;margin-bottom:8px}
.tone-table{display:flex;flex-direction:column;gap:10px}
.tone-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.tone-row:first-child{border-top:0;padding-top:0}
.tone-ma{font-family:var(--f-vi);font-size:30px;font-weight:700;line-height:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tone-ma small{font-size:11px;color:var(--ink2);font-family:var(--f-ko);font-weight:500}
.tone-row h4{margin:0 0 2px;font-size:15px}
.tone-row p{margin:0;font-size:13.5px;color:var(--ink2)}
.tone-row .gest{margin-top:4px;font-size:13px}
.src-note{font-size:12px;color:var(--ink3);margin-top:8px}
.rx-src{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.rx-src a{color:var(--jade);overflow-wrap:anywhere}
.chrow.rx .chnum{color:var(--ochre)}
.chrow.rx{border-style:dashed;border-color:var(--ochre)}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev b{font-size:14.5px}
.ev .lvl{font-size:12px;font-weight:600;border-radius:99px;padding:2px 8px;align-self:start}
.lvl.s{background:var(--good-soft);color:var(--good)} .lvl.m{background:var(--ochre-soft);color:var(--ochre)} .lvl.w{background:var(--sunk);color:var(--ink2)}
.ev p{grid-column:1/-1;margin:0;font-size:13.5px;color:var(--ink2)}
.routine{display:flex;flex-direction:column;gap:0}
.routine div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.routine div:first-child{border-top:0}
.routine b{font-variant-numeric:tabular-nums}
.mission{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission .vi{font-size:16.5px;font-weight:600}
.mission .ko{grid-column:1;font-size:13.5px;color:var(--ink2)}
.mission .acts{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.done-toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:12px;padding:3px 10px;font-weight:600;color:var(--ink2)}
.done-toggle[aria-pressed="true"]{background:var(--good-soft);border-color:transparent;color:var(--good)}
a{color:var(--jade)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink3)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--jade)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:620px;width:100%;margin:0 auto}
.sheet-head .grow{flex:1;min-width:0}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);transition:width .25s}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .inner{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:620px;width:100%;margin:0 auto}
/* flashcard */
.flash{perspective:1400px;margin-top:6px}
.flash-in{position:relative;height:min(66vh,600px);min-height:340px;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .tag{display:flex;gap:6px;flex-wrap:wrap}
.face .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:12px 0}
.face .vbig{font-family:var(--f-vi);font-weight:700;font-size:clamp(32px,10vw,50px);line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.face .vbig.long{font-size:clamp(22px,6.4vw,30px);font-weight:600;line-height:1.3}
.face .kbig{font-size:clamp(22px,6.6vw,30px);font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.face .hint{font-size:13px;color:var(--ink3)}
.speak{width:56px;height:56px;border-radius:50%;border:0;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center}
.speak svg{width:26px;height:26px}
.speak.sm{width:40px;height:40px}
.speak.sm svg{width:20px;height:20px}
.backbody{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.backbody .vmid{font-family:var(--f-vi);font-weight:700;font-size:clamp(24px,7vw,34px);line-height:1.2;overflow-wrap:anywhere}
.backbody .kmid{font-size:20px;font-weight:600;line-height:1.4}
.sylls{display:flex;gap:6px;flex-wrap:wrap}
.syl{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:13px}
.syl .vi{font-weight:700;font-size:15px}
.note{font-size:13.5px;border-radius:12px;padding:10px 12px;background:var(--sunk)}
.note.hz{background:var(--lacquer-soft)}
.note.hz.same{background:var(--jade-soft)}
.note b{font-weight:600}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border-radius:16px;border:1px solid var(--line);background:var(--card);min-height:62px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700}
.grades small{font-size:11.5px;font-weight:500;color:var(--ink2)}
.grades .g0{border-color:var(--lacquer);color:var(--lacquer)}
.grades .g1{border-color:var(--ochre);color:var(--ochre)}
.grades .g2{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.grades .g2 small{color:var(--on-jade);opacity:.85}
/* quiz */
.q-prompt{text-align:center;padding:26px 8px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.q-prompt .vbig{font-family:var(--f-vi);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.2;overflow-wrap:anywhere}
.q-prompt .kbig{font-size:clamp(21px,6vw,27px);font-weight:600;line-height:1.35}
.q-opts{display:flex;flex-direction:column;gap:10px}
.q-opts button{min-height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:10px 16px;text-align:left;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.q-opts button.vi{font-size:19px;font-weight:600}
.q-opts button.ok{border-color:var(--good);background:var(--good-soft)}
.q-opts button.no{border-color:var(--lacquer);background:var(--lacquer-soft)}
.q-meta{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.combo{font-family:var(--f-vi);font-weight:800;color:var(--ochre)}
.timer{font-family:var(--f-vi);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.result-big{font-family:var(--f-vi);font-size:64px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px}
.chips-sel button{min-width:44px;min-height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-family:var(--f-vi);font-weight:700}
.chips-sel button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.mode{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:13px 14px;width:100%;box-shadow:var(--shadow)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--ink2)}
.mode .best{grid-row:1/3;grid-column:2;font-family:var(--f-vi);font-weight:700;color:var(--jade);font-size:13px;text-align:right}
/* settings */
.set{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set label,.set .lbl{font-weight:600;font-size:14.5px}
.set .desc{font-size:12.5px;color:var(--ink2)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:36px;padding:0 13px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.opts button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
textarea{min-height:92px;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.status{font-size:13px;border-radius:10px;padding:8px 10px;background:var(--sunk)}
.status.ok{background:var(--good-soft);color:var(--good)} .status.warn{background:var(--ochre-soft);color:var(--ochre)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
details summary{font-weight:600;cursor:pointer}
details ol{margin:8px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink2)}
.gt{font-size:12.5px;font-weight:600;color:var(--jade);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.vhelp{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:70;padding:0 12px}
.vhelp-in{max-width:540px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 34px -12px rgba(0,0,0,.5);padding:14px 16px;max-height:calc(100vh - 40px);overflow:auto}
.vsteps{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);text-align:center}
.empty{padding:22px;text-align:center;color:var(--ink2);font-size:14px}
.foot{font-size:12px;color:var(--ink3);margin-top:26px;line-height:1.6}
/* sentences, examples, dialogues */
.chip.mk{background:var(--ochre-soft);color:var(--ochre);font-weight:600}
.chip.core{background:var(--jade-soft);color:var(--jade)}
.item.made{background:linear-gradient(90deg,var(--ochre-soft) 0 4px,transparent 4px)}
.note.mk{background:var(--ochre-soft)}
.ab{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink3);color:var(--card);font:700 11.5px/1 var(--f-ko);margin-right:7px;vertical-align:2px;flex:none}
.spk{font-family:var(--f-vi);font-size:12.5px;font-weight:700;color:var(--jade);letter-spacing:0}
.spk.big{font-size:15px}
.exs{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.exs-h{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink3)}
.exl{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.exl-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.exl-t .vi{font-size:16px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.exl-k{font-size:13.5px;color:var(--ink2)}
.exl-s{font-size:11.5px;color:var(--ink3)}
.exl.made .exl-s{color:var(--ochre);font-weight:600}
b.hit{font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:currentColor}
.dlg{margin-bottom:12px;padding:14px}
.dl-body{display:flex;flex-direction:column;margin-top:10px}
.dl-line{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.dl-line:first-child{border-top:0}
.dl-line.playing{background:var(--jade-soft);border-radius:12px;box-shadow:0 0 0 6px var(--jade-soft)}
.dl-line.mine .dl-spk span:first-child{color:var(--lacquer)}
.dl-spk{display:flex;flex-direction:column;font-size:11.5px;line-height:1.25;color:var(--ink3);padding-top:3px;overflow-wrap:anywhere}
.dl-spk .vi{font-size:12.5px;font-weight:700;color:var(--jade)}
.dl-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl-vi{font-size:17px;font-weight:600;line-height:1.38;overflow-wrap:anywhere}
.dl-ko{font-size:13.5px;color:var(--ink2)}
.dl-dir{text-align:center;font-size:13px;color:var(--ink3);font-style:italic;padding:8px 0;border-top:1px solid var(--line)}
.peek{align-self:flex-start;border:1px dashed var(--ink3);background:var(--sunk);color:var(--ink2);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px}
.face .vbig.xlong{font-size:clamp(18px,5vw,22px)}
.face .kbig.long{font-size:clamp(18px,5vw,22px)}
.bd-ans{min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;border-bottom:2px solid var(--line);padding:6px 4px 12px;margin-bottom:16px}
.bd-w{font-size:20px;font-weight:700}
.bd-gap{display:inline-block;width:42px;height:4px;border-radius:2px;background:var(--jade);opacity:.5}
.bd-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bd-tile{min-height:50px;min-width:50px;padding:6px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:19px;font-weight:600;box-shadow:var(--shadow)}
.bd-tile.bad{border-color:var(--lacquer);background:var(--lacquer-soft);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nx-prev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.q-opts button.long{font-size:16.5px;font-weight:500}
/* free talk */
.tk-lbl{font-weight:700;font-size:14px;margin:16px 0 7px}
.tk-opt{display:flex;flex-wrap:wrap;gap:6px}
.tk-opt button{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:38px;padding:0 13px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.tk-opt button small{font-size:11px;font-weight:500;opacity:.75}
.tk-opt button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.tk-opt button:disabled{opacity:.38;cursor:default}
.tk-chat{display:flex;flex-direction:column;gap:12px;padding:6px 0 14px}
.tk-msg{display:flex;flex-direction:column;max-width:88%}
.tk-msg.ai{align-self:flex-start}
.tk-msg.me{align-self:flex-end;align-items:flex-end}
.tk-who{font-family:var(--f-vi);font-size:12.5px;font-weight:700;color:var(--jade);margin:0 6px 3px}
.tk-bub{border-radius:18px;padding:10px 13px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tk-msg.ai .tk-bub{border-top-left-radius:6px}
.tk-msg.me .tk-bub{background:var(--jade);border-color:var(--jade);color:var(--on-jade);border-top-right-radius:6px}
.tk-vi{font-family:var(--f-vi);font-size:18px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.tk-ko{font-size:14px;color:var(--ink2);margin-top:3px}
.tk-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.tk-tools .mini,.linkbtn{border:1px solid var(--line);background:var(--sunk);border-radius:999px;font-size:12.5px;font-weight:600;padding:3px 11px;min-height:32px;color:var(--ink2)}
.linkbtn{min-height:26px;padding:1px 9px}
.mini-speak{border:0;background:none;color:var(--ink3);width:34px;height:30px;display:grid;place-items:center;margin-top:2px}
.mini-speak svg{width:17px;height:17px}
.tk-words{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.tk-words .vi{font-weight:700}
.oor{text-decoration:underline dotted var(--lacquer);text-decoration-thickness:2px;text-underline-offset:4px}
.tk-typing{display:inline-flex;gap:5px;padding:5px 2px}
.tk-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:tkdot 1s infinite ease-in-out}
.tk-typing.big i{width:11px;height:11px}
.tk-typing i:nth-child(2){animation-delay:.15s}.tk-typing i:nth-child(3){animation-delay:.3s}
@keyframes tkdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.tk-retry{display:flex;justify-content:center}
.tk-foot{padding-top:8px;border-top:1px solid var(--line);background:var(--paper)}
.tk-compose{display:flex;gap:8px;align-items:flex-end}
.tk-compose textarea{flex:1;min-height:48px;max-height:120px;resize:none;border-radius:16px;padding:12px 14px;font-family:var(--f-vi);font-size:16px;line-height:1.35;word-break:normal}
.tk-compose .btn{min-height:48px;padding:0 16px}
.tk-compose .icon-btn{width:48px;height:48px;font-size:20px}
.tk-hints{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.tk-hints:empty{display:none}
.tk-hint{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px dashed var(--ochre);background:var(--ochre-soft);border-radius:14px;padding:8px 12px}
.tk-hint .vi{font-size:16px;font-weight:600}
.tk-hk{font-size:13px;color:var(--ink2)}
.tk-avg{font-family:var(--f-vi);font-size:34px;font-weight:800;line-height:1;color:var(--jade)}
.tk-avg small{font-size:14px;color:var(--ink3);font-weight:600}
.tk-scores{display:flex;flex-direction:column;gap:8px}
.tk-sc{display:grid;grid-template-columns:86px auto minmax(0,1fr);gap:4px 10px;align-items:center;font-size:13.5px}
.tk-sc-l{font-weight:700}
.tk-sc-n{color:var(--ink2);font-size:12.5px;grid-column:1/-1}
.tk-dots{display:inline-flex;gap:4px}
.tk-dots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.tk-dots i.on{background:var(--jade);border-color:var(--jade)}
.tk-ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.tk-you{font-family:var(--f-vi);font-size:16px;color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--lacquer);text-decoration-thickness:1.5px;overflow-wrap:anywhere}
.tk-better{font-size:18px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.item.tk-hist .m{font-size:13px}
.tk-sub{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin-top:1px}
@media (min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.flash-in{transition:none}}

/* Gemini & Push-to-Talk Voice Additions */
.mic-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--jade);background:var(--jade-soft);color:var(--jade);display:inline-grid;place-items:center;flex:none;font-size:20px;transition:transform .15s,background .15s}
.mic-btn.rec{background:var(--lacquer);border-color:var(--lacquer);color:#fff;animation:pulse-rec 1.2s infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(184,55,42,.45)}50%{box-shadow:0 0 0 8px rgba(184,55,42,0)}}
.rec-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--lacquer-soft);color:var(--lacquer);border:1px solid var(--lacquer);border-radius:12px;padding:7px 12px;margin-bottom:8px;font-size:13px;font-weight:600}
.api-box{border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 14px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.api-box input{width:100%;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13.5px}

</style>

l0wd4z","vi":"Ừ, cũng được.","ko":"그래, 그래도 되지.","sv":"Hoa","sk":"호아"}]},{"id":"d11tcf6t","ch":10,"p":160,"no":"1","kind":"dialogue","lines":[{"id":"lnjussp","vi":"Sở thích của em là gì?","ko":"너의 취미는 무엇이야?","sv":"Se-ho","sk":"세호","pid":"s1tmv1kg"},{"id":"l9sxi83","vi":"Em thích chơi bóng đá ạ. Vào ngày nghỉ, em thường đá bóng cùng với các bạn em.","ko":"저는 축구하는 것을 좋아해요. 휴일에 저는 보통 제 친구들과 함께 축구를 해요.","sv":"Hùng","sk":"훙"},{"id":"l1j7wim6","vi":"Vậy em có biết cầu thủ bóng đá Hàn Quốc Son Heung-min không?","ko":"그러면 너는 한국 축구 선수 손흥민을 아니?","sv":"Se-ho","sk":"세호"},{"id":"l1wt7tt2","vi":"Biết chứ ạ! Em là fan hâm mộ của Son Heung-min đấy. Anh ấy chơi giỏi thật.","ko":"알고 말고요! 저는 손흥민 선수의 팬이에요. 그는 정말 (축구)플레이를 잘 해요.","sv":"Hùng","sk":"훙"}]},{"id":"d105et0z","ch":10,"p":166,"no":"2","kind":"dialogue","lines":[{"id":"lqcviwv","vi":"Khi rỗi, anh thường làm gì?","ko":"한가할 때, 형은 보통 뭘 해요?","sv":"Hùng","sk":"훙"},{"id":"l6armkq","vi":"Anh thường đi xem phim hoặc đi mua sắm.","ko":"나는 보통 영화를 보러 가거나 쇼핑을 가.","sv":"Se-ho","sk":"세호"},{"id":"l1q0hii3","vi":"Vậy anh thích loại phim nào nhất?","ko":"그러면 형은 어떤 종류의 영화를 가장 좋아해요?","sv":"Hùng","sk":"훙"},{"id":"llet685","vi":"Anh thích nhất phim hành động. Còn em thì sao?","ko":"나는 액션 영화를 가장 좋아해. 너는 어떤데?","sv":"Se-ho","sk":"세호"},{"id":"lrop3su","vi":"Em thì thích phim hài hơn ạ.","ko":"저는 코믹 영화를 더 좋아해요.","sv":"Hùng","sk":"훙","pid":"s1r0ri8f"}]},{"id":"d1t8n061","ch":11,"p":176,"no":"1","kind":"dialogue","lines":[{"id":"lhlsbbj","vi":"Chúng ta bắt đầu học nhé. Hôm nay chúng ta sẽ học về phát âm tiếng Việt. Các em hãy nghe cô đọc nhé.","ko":"수업 시작하겠습니다. 오늘 우리는 베트남어 발음에 대해 공부할 거예요. 모두 선생님이 읽는 것을 잘 들으세요.","sv":"Cô giáo","sk":"여선생님"},{"id":"l14br2tc","vi":"(Một lúc sau)","ko":"(잠시 뒤)","dir":1,"say":"Một lúc sau"},{"id":"l1ldqyrc","vi":"Hôm nay chúng ta học đến đây nhé. Có ai hỏi gì nữa không?","ko":"오늘은 여기까지 하겠습니다. 누구 질문할 사람 있나요?","sv":"Cô giáo","sk":"여선생님"},{"id":"lzwxw5z","vi":"Cô ạ, tuần sau có bài kiểm tra, đúng không ạ? Có khó không ạ?","ko":"선생님, 다음 주에 시험이 있어요, 그렇죠? 어렵나요?","sv":"Se-ho","sk":"세호"},{"id":"l1fggygt","vi":"Không khó.","ko":"어렵지 않아요.","sv":"Cô giáo","sk":"여선생님"}]},{"id":"d1vqmkwr","ch":11,"p":181,"no":"2","kind":"dialogue","lines":[{"id":"liplmo6","vi":"Khi còn là sinh viên, chị thích học môn gì nhất?","ko":"대학생 이었을 때 언니는 무슨 과목을 가장 좋아했어요?","sv":"Trang","sk":"짱","pid":"s1b1hkha"},{"id":"l138yu33","vi":"Chị thích học môn ngoại ngữ nhất. Chị đã từng học tiếng Việt, tiếng Trung v.v.","ko":"나는 외국어 과목을 가장 좋아했어. 나는 베트남어랑 중국어 등을 배웠어.","sv":"Mi-na","sk":"미나"},{"id":"ltbe328","vi":"Chuyên môn của chị là gì?","ko":"언니의 전공은 원래 무엇이었어요?","sv":"Trang","sk":"짱"},{"id":"l1hs9ij0","vi":"Chuyên môn của chị vốn là kinh doanh và tiếng Việt.","ko":"전공은 경영이랑 베트남어였어.","sv":"Mi-na","sk":"미나"},{"id":"lcv1a8s","vi":"Thế à? Bây giờ học lại tiếng Việt thì thấy thế nào?","ko":"그래요? 지금 다시 베트남어를 공부하니 어때요?","sv":"Trang","sk":"짱"},{"id":"l19frv83","vi":"Chị thấy tiếng Việt càng học càng thú vị.","ko":"내가 보기에 베트남어는 공부할수록 재미있어.","sv":"Mi-na","sk":"미나","pid":"sx8ns5y"}]},{"id":"d1skpena","ch":12,"p":192,"no":"1","kind":"dialogue","lines":[{"id":"l47h8b8","vi":"Em đi đâu về à? Hôm nay thời tiết thế nào?","ko":"어디 다녀 와? 오늘 날씨가 어때?","sv":"Se-ho","sk":"세호"},{"id":"l17tbguu","vi":"Em đi học về. Trời hôm nay nắng và nóng lắm.","ko":"저는 공부하고 왔어요. 오늘 날씨는 매우 쨍쨍하고 더워요.","sv":"Trang","sk":"짱"},{"id":"l1u4b1wg","vi":"Anh không thích trời nóng. Nên anh thích mùa thu nhất.","ko":"나는 더운 날씨가 싫어. 그래서 나는 가을을 가장 좋아해.","sv":"Se-ho","sk":"세호"},{"id":"ltcs8kv","vi":"Vì sao anh thích mùa thu nhất?","ko":"왜 가을을 가장 좋아하세요?","sv":"Trang","sk":"짱","pid":"s12w0vmu"},{"id":"liexkrx","vi":"Vì vào mùa thu trời trong, cao và mát.","ko":"왜냐하면 가을에는 하늘이 맑고 높으며, 시원하기 때문이야.","sv":"Se-ho","sk":"세호"}]},{"id":"d1tynf45","ch":12,"p":197,"no":"2","kind":"dialogue","lines":[{"id":"lkegriq","vi":"Trang ơi, chị muốn đi du lịch Thành phố Hồ Chí Minh mà không biết mùa nào tốt nhất.","ko":"짱, 나는 호찌민시로 여행가고 싶은데 어느 계절이 가장 좋니?","sv":"Mi-na","sk":"미나"},{"id":"l15ca0ep","vi":"TP. Hồ Chí Minh thì khác với Hà Nội, cả năm đều nóng.","ko":"호찌민시는 하노이와 다르게 일 년 내내 더워요.","sv":"Trang","sk":"짱"},{"id":"lg2yfwu","vi":"Thế à? Khác như thế nào?","ko":"그래? 어떻게 다른데?","sv":"Mi-na","sk":"미나"},{"id":"l1tvsmm5","vi":"Hà Nội có 4 mùa như Hàn Quốc nhưng TP. Hồ Chí Minh chỉ có 2 mùa là mùa mưa và mùa khô thôi.","ko":"하노이는 한국처럼 4계절이지만 호찌민시는 단지 우기와 건기의 두 계절 뿐이에요.","sv":"Trang","sk":"짱"},{"id":"lwsuksk","vi":"Nếu chị đi vào tháng 8 thì là mùa mưa hay mùa khô?","ko":"만약 8월에 간다면 우기야 건기야?","sv":"Mi-na","sk":"미나","pid":"s1fttenj"},{"id":"l1nw8x91","vi":"Tháng 8 thì là mùa mưa.","ko":"8월이면 우기예요.","sv":"Trang","sk":"짱"}]},{"id":"dnew15f","ch":13,"p":208,"no":"1","kind":"dialogue","lines":[{"id":"l10booha","vi":"Anh ơi, anh bị làm sao thế?","ko":"오빠, 어디가 안 좋아요?","sv":"Trang","sk":"짱"},{"id":"lywe1ze","vi":"Anh bị đau họng từ tối qua và bây giờ bị sốt đến 39°C.","ko":"어제 저녁부터 목이 아프고 지금은 열이 39도까지 올랐어.","sv":"Se-ho","sk":"세호","pid":"s1trk99j"},{"id":"ltam2xw","vi":"Anh đã đi gặp bác sĩ chưa?","ko":"의사를 만나 봤어요(병원에 가봤어요)?","sv":"Trang","sk":"짱"},{"id":"l1kmhhnt","vi":"Chưa. Anh chỉ uống thuốc thôi. Nhưng lát nữa anh sẽ đi bệnh viện.","ko":"아직. 그냥 약만 먹었어. 그런데 조금 뒤에 병원에 가 보려고.","sv":"Se-ho","sk":"세호"},{"id":"l9rzgnu","vi":"Chúc anh sớm khỏi bệnh.","ko":"빨리 낫기를 바라요.","sv":"Trang","sk":"짱"},{"id":"l1qzvtfn","vi":"Ừ. cảm ơn em.","ko":"응. 고마워.","sv":"Se-ho","sk":"세호"}]},{"id":"dnoshcf","ch":13,"p":213,"no":"2","kind":"dialogue","lines":[{"id":"l1e3mtud","vi":"Chào anh. Anh bị đau họng và bị sốt, đúng không ạ? Để tôi khám bệnh cho.","ko":"안녕하세요. 목이 아프고 열이 난다구요. 제가 진찰해볼게요.","sv":"Bác sĩ","sk":"의사"},{"id":"lj8cpcz","vi":"Thế nào? Có nặng không ạ?","ko":"어떤가요? 심한가요?","sv":"Se-ho","sk":"세호"},{"id":"l1f7d735","vi":"Anh bị cảm rồi nhưng không nặng lắm. Đừng lo nhé. Nhưng mặt anh trông mệt quá. Anh nên nghỉ nhé.","ko":"감기인데 그리 심하지 않아요. 걱정 마세요. 그런데 얼굴이 너무 지쳐 보여요. 쉬면 좋겠어요.","sv":"Bác sĩ","sk":"의사"},{"id":"lpwwx7q","vi":"Dạo này, tôi có nhiều việc làm nên đã không nghỉ được ạ.","ko":"요새 일이 많아서 쉴 수가 없었어요.","sv":"Se-ho","sk":"세호","pid":"s2jn8zn"},{"id":"l139ydyd","vi":"Anh uống thuốc 2 đến 3 ngày nhé. Uống nhiều nước và nghỉ thì sẽ khỏi.","ko":"약을 2~3일간 드세요. 물을 많이 드시고 쉬면 나을 겁니다.","sv":"Bác sĩ","sk":"의사"},{"id":"l1j0zhfg","vi":"Dạ, cảm ơn bác sĩ.","ko":"네, 감사합니다, 선생님.","sv":"Se-ho","sk":"세호"}]},{"id":"d1kwiq3b","ch":14,"p":null,"no":"1","kind":"dialogue","title":"처음 만나 연구 소개하기","x":1,"lines":[{"id":"l1k10x9y","vi":"Xin chào. Em là người Việt Nam, phải không?","ko":"안녕하세요. 베트남 사람이죠?","sv":"Jooyoung","sk":"주영","x":1},{"id":"l1vb412e","vi":"Dạ, vâng ạ.","ko":"네, 맞아요.","sv":"Người lao động","sk":"노동자","x":1},{"id":"lvbykkb","vi":"Tôi tên là Jooyoung. Tôi là nhà nghiên cứu.","ko":"저는 이름이 주영이에요. 연구자예요.","sv":"Jooyoung","sk":"주영","x":1},{"id":"l3cdedk","vi":"Nhà nghiên cứu ạ? Nghiên cứu về gì ạ?","ko":"연구자요? 무엇을 연구하세요?","sv":"Người lao động","sk":"노동자","x":1},{"id":"l5rghg5","vi":"Tôi đang nghiên cứu về cuộc sống của người lao động Việt Nam ở Hàn Quốc.","ko":"한국에 사는 베트남 노동자들의 생활을 연구하고 있어요.","sv":"Jooyoung","sk":"주영","x":1},{"id":"l1es9161","vi":"Thế à? Nghiên cứu về chúng em ạ?","ko":"그래요? 저희에 대해 연구해요?","sv":"Người lao động","sk":"노동자","x":1},{"id":"lo8pe8q","vi":"Vâng. Tôi muốn nghe câu chuyện của em. Em có thời gian không?","ko":"네. 이야기를 듣고 싶어요. 시간 있어요?","sv":"Jooyoung","sk":"주영","x":1},{"id":"lln3w78","vi":"Hôm nay em phải đi làm. Chủ nhật này thì em rảnh ạ.","ko":"오늘은 일하러 가야 해요. 이번 일요일이면 시간 있어요.","sv":"Người lao động","sk":"노동자","x":1},{"id":"ll0qj15","vi":"Tốt quá! Tôi muốn phỏng vấn em khoảng một tiếng.","ko":"잘됐네요! 한 시간쯤 인터뷰하고 싶어요.","sv":"Jooyoung","sk":"주영","x":1},{"id":"l1pjr7qv","vi":"Phỏng vấn ở đâu ạ?","ko":"인터뷰는 어디서 해요?","sv":"Người lao động","sk":"노동자","x":1},{"id":"l1ya40gc","vi":"Ở quán cà phê gần đây, được không?","ko":"이 근처 카페에서요, 괜찮아요?","sv":"Jooyoung","sk":"주영","x":1},{"id":"l5l7igs","vi":"Dạ, được ạ.","ko":"네, 좋아요.","sv":"Người lao động","sk":"노동자","x":1}]},{"id":"d1l6ibsa","ch":14,"p":null,"no":"2","kind":"dialogue","title":"인터뷰 전에 동의 받기","x":1,"l <script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('data').textContent);
var W = DATA.words, S = DATA.sents, CH = DATA.chapters, EX = DATA.ex||[], DLG = DATA.dlg||[], MK = DATA.mk||[];
var LN = [];  /* dialogue lines as cards (textbook 회화 and the 💡 invented ones of Bài 14~16) */
DLG.forEach(function(d){ d.lines.forEach(function(l, i){ l.ch=d.ch; l.p=d.x?[]:[d.p]; l.dl=d.id; l.t='회화 '+d.no; l.no=d.no; l.ix=i; if(d.x) l.x=1; if(!l.dir) LN.push(l); }); });
var RXL = LN.filter(function(l){ return l.x; });
var TBS = S.concat(EX, LN.filter(function(l){ return !l.x; }));   /* every textbook sentence */
var RXS = MK.filter(function(m){ return m.x; }).concat(RXL);         /* 💡 Bài 14~16 research sentences and lines */
var SALL = TBS.concat(MK, RXL);   /* plus the sentences made for this app */
var BYID = {}; W.concat(SALL, DLG).forEach(function(c){ BYID[c.id]=c; });
var ME = DATA.me || {vi:'', ko:''};   /* the learner: called by the given name, as Vietnamese do (교재 p.55) */
var INT = [0,1,2,4,8,16];
var KEY = 'nghe-noi-a1-cards-v1';

/* ---------- storage (per device; page still works if storage is blocked) ---------- */
var DEFAULTS = {v:1, prog:{}, memo:{}, missions:{}, best:{}, seenIntro:false,
  settings:{upto:8, newPerDay:8, front:'vi', autoplay:true, rate:0.8, voice:'', tone:true, pic:true, rx:true},
  streak:{last:-1, count:0, best:0}, daily:{day:-1, newCount:0, done:0}};
function clone(o){return JSON.parse(JSON.stringify(o));}
var state = clone(DEFAULTS);
function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var s = JSON.parse(raw); merge(s); } }catch(e){}
}
function merge(s){
  var d = clone(DEFAULTS);
  if(!s || typeof s!=='object') return;
  for(var k in d){ if(s[k]!==undefined){ if(typeof d[k]==='object' && !Array.isArray(d[k]) && d[k]!==null){ for(var j in s[k]) d[k][j]=s[k][j]; } else d[k]=s[k]; } }
  state = d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
load();

/* ---------- dates ---------- */
function dayNum(){ var d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000); }
function rollDay(){ var t=dayNum(); if(state.daily.day!==t){ state.daily={day:t,newCount:0,done:0}; } }
rollDay();

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var TM = {'̀':'huyen','́':'sac','̉':'hoi','̃':'nga','̣':'nang'};

var LETTERS = /[A-Za-zÀ-ɏḀ-ỿ]+/g;

  if(/^[A-Z]$/.test(syl)) return null;
  var d = syl.normalize('NFD');
  for(var i=0;i<d.length;i++){ if(TM[d[i]]) return TM[d[i]]; }
  return /[a-zđ]/i.test(syl) ? 'ngang' : null;
}
function toneHTML(text){
  return esc(text).replace(LETTERS, function(m){ var t=toneOf(m); return t ? '<span class="t t-'+t+'">'+m+'</span>' : m; });
}
function sylls(text){ var out=[]; String(text).replace(LETTERS,function(m){ var t=toneOf(m); if(t) out.push([m,t]); return m;}); return out; }
function stripTone(syl){ var d=syl.normalize('NFD'); var o=''; for(var i=0;i<d.length;i++){ if(!TM[d[i]]) o+=d[i]; } return o.normalize('NFC'); }
var MARK = {ngang:'',sac:'́',huyen:'̀',hoi:'̉',nga:'̃',nang:'̣'};
function placeTone(base, tone){
  var mark = MARK[tone]; if(!mark) return base;
  var low = base.toLowerCase(), V='aăâeêioôơuưy', idx=[];
  for(var i=0;i<low.length;i++){ if(V.indexOf(low[i])>=0) idx.push(i); }
  if(low.indexOf('qu')===0 && idx[0]===1) idx.shift();
  if(low.indexOf('gi')===0 && idx[0]===1 && idx.length>1) idx.shift();
  if(!idx.length) return base;
  var pri = idx.filter(function(i){return 'ăâêôơư'.indexOf(low[i])>=0;}), pos;
  if(pri.length) pos = pri[pri.length-1];
  else if(idx.length===1) pos = idx[0];
  else { var last=idx[idx.length-1]; if(last<low.length-1) pos=last; else { var cl=low.slice(idx[0],last+1).slice(-2); pos=(cl==='oa'||cl==='oe'||cl==='uy')?last:idx[idx.length-2]; } }
  return (base.slice(0,pos+1)+mark+base.slice(pos+1)).normalize('NFC');
}

function wordToks(vi){ var v=String(vi).replace(/[가-힣+]+/g,' ').replace(/\(([^)]*)\)/g,'$1').replace(/(\S+)\/\S+/g,'$1').split(/\s+\/\s+|,\s*/)[0]; return (v.match(/[A-Za-zÀ-ɏḀ-ỿ]+/g)||[]).map(function(t){return t.toLowerCase();}); }
function markWord(sentence, wvi){
  var wt=wordToks(wvi), re=/[A-Za-zÀ-ɏḀ-ỿ]+/g, m, toks=[];
  while((m=re.exec(sentence))) toks.push({s:m[0], i:m.index});
  var hit={};
  if(wt.length){ for(var i=0;i+wt.length<=toks.length;i++){ var ok=true; for(var j=0;j<wt.length;j++){ if(toks[i+j].s.toLowerCase()!==wt[j]){ ok=false; break; } } if(ok){ for(var k=0;k<wt.length;k++) hit[i+k]=1; break; } } }
  var out='', last=0;
  toks.forEach(function(t, n){ out+=esc(sentence.slice(last, t.i)); var tn=toneOf(t.s), span=tn?'<span class="t t-'+tn+'">'+esc(t.s)+'</span>':esc(t.s); out+= hit[n]?'<b class="hit">'+span+'</b>':span; last=t.i+t.s.length; });
  return out+esc(sentence.slice(last));

function isVi(v){ return /^vi([-_]|$)/i.test(v.lang||''); }
function refreshVoices(){
  if(!SP.ok) return;
  try{ SP.voices = window.speechSynthesis.getVoices() || []; }catch(e){ SP.voices=[]; }

function playMark(id){ Array.prototype.forEach.call(document.querySelectorAll('.dl-line.playing'), function(e){ e.classList.remove('playing'); }); if(id){ var el=document.querySelector('[data-line="'+id+'"]'); if(el) el.classList.add('playing'); } }
/* read several lines one after another (a whole dialogue) */
function speakSeq(items){
  if(!items.length) return;
  if(!SP.ok){ voiceHelp(items[0].text,'none'); return; }
  var ss=window.speechSynthesis, my=++seqId, i=0;
  try{ if(ss.speaking||ss.pending) ss.cancel(); ss.resume(); }catch(e){}
  if(!viVoices().length) refreshVoices();
  function next(){
    if(my!==seqId) return;
    if(i>=items.length){ playMark(null); return; }
    var it=items[i], u=new SpeechSynthesisUtterance(it.text);
    u.lang='vi-VN'; if(SP.vi) u.voice=SP.vi; u.rate=state.settings.rate;
    u.onstart=function(){ SP.worked=true; playMark(it.id); };
    u.onend=function(){ if(my!==seqId) return; i++; setTimeout(next, 450); };
    u.onerror=function(ev){ var er=ev&&ev.error; if(er==='interrupted'||er==='canceled') return; playMark(null); voiceHelp(it.text,'error'); };
    curUtter=u; try{ ss.speak(u); }catch(e){ voiceHelp(it.text,'error'); }
  }
  next(); SP.unlocked=true;
}
function speak(text, rate){
  seqId++; playMark(null);
  if(!SP.ok){ voiceHelp(text,'none'); return; }
  var ss=window.speechSynthesis;
  try{
    if(ss.speaking || ss.pending) ss.cancel();
    try{ ss.resume(); }catch(e){}
    if(!viVoices().length) refreshVoices();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'vi-VN'; if(SP.vi) u.voice = SP.vi;
    u.rate = rate || state.settings.rate;
    var started=false;
    u.onstart=function(){ started=true; SP.worked=true; };
    u.onerror=function(ev){ var er=ev&&ev.error; if(er==='interrupted'||er==='canceled') return; voiceHelp(text, 'error'); };
    curUtter=u; ss.speak(u); SP.unlocked = true;
    clearTimeout(speakTimer);
    speakTimer=setTimeout(function(){ if(!started && !SP.worked) voiceHelp(text,'nostart'); }, 2000);
    if(!viVoices().length && !SP.warnedNoVi){ SP.warnedNoVi=true; setTimeout(function(){ if(!viVoices().length) voiceHelp(text,'novi'); }, 700); }
  }catch(e){ voiceHelp(text,'error'); }
}

/* ---------- streak / grading ---------- */
function bumpDone(){
  rollDay(); state.daily.done++;
  var t=state.daily.day;
  if(state.daily.done===5 && state.streak.last!==t){
    state.streak.count = (state.streak.last===t-1) ? state.streak.count+1 : 1;
    state.streak.last = t; state.streak.best = Math.max(state.streak.best, state.streak.count);
    toast('오늘 5장 달성! 연속 '+state.streak.count+'일째');
  }
}
function streakNow(){ var t=dayNum(); return (state.streak.last===t||state.streak.last===t-1) ? state.streak.count : 0; }
function grade(card, g, failedInSession){
  rollDay();
  var k=pkey(card), p=state.prog[k] || {b:0,d:0,n:0}, t=state.daily.day;
  if(!p.n){ state.daily.newCount++; if(isX(card)) state.daily.newX=(state.daily.newX||0)+1; }
  if(g===2){ if(failedInSession){ p.b=1; p.d=t+1; } else { p.b=Math.min(5,(p.b||0)+1); p.d=t+INT[p.b]; } }
  else if(g===1){ p.b=1; p.d=t+1; p.tn=(p.tn||0)+1; }
  else { p.b=1; p.d=t; p.x=(p.x||0)+1; }
  p.n=(p.n||0)+1; p.l=t; state.prog[k]=p; bumpDone(); save();
}
function markWrong(card){ var k=pkey(card), p=state.prog[k]||{b:0,d:0,n:0}; p.b=1; p.d=dayNum(); p.x=(p.x||0)+1; if(!p.n) p.n=1; state.prog[k]=p; save(); }

/* ---------- pools ---------- */
/* textbook cards follow the progress setting; the 💡 Bài 14~16 research cards follow their own switch */
function inRange(c){ if(isX(c)) return !!state.settings.rx; return c.ch<=state.settings.upto && (state.settings.pic || c.ch!==1); }
var RX_DAILY = 2;  /* new research words per day, more only when the textbook range has no new words left */
function dailyQueue(extraNew){
  rollDay(); var t=dayNum(), seen={}, due=[], fresh=[], freshX=[];
  W.forEach(function(w){
    if(!inRange(w)) return; var k=pkey(w); if(seen[k]) return; seen[k]=1;
    var p=state.prog[k];
    if(p && p.n){ if(p.d<=t) due.push(w); } else (isX(w)?freshX:fresh).push(w);
  });
  /* sentences join the review once you have studied them in a chapter deck */
  SALL.forEach(function(s){
    if(!inRange(s)) return; var k=pkey(s); if(seen[k]) return; seen[k]=1;
    var p=state.prog[k]; if(p && p.n && p.d<=t) due.push(s);
  });
  due.sort(function(a,b){ return prog(a).d-prog(b).d || prog(a).b-prog(b).b; });
  var left = Math.max(0, state.settings.newPerDay - state.daily.newCount) + (extraNew||0);
  var nx = Math.min(freshX.length, left, Math.max(0, RX_DAILY - (state.daily.newX||0)));
  var nt = Math.min(fresh.length, left - nx);
  if(nt < left - nx) nx = Math.min(freshX.length, left - nt);
  return {due:due, fresh:fresh.slice(0,nt).concat(freshX.slice(0,nx)), freshTotal:fresh.length+freshX.length};
}
function chStats(n){
  var cs=W.filter(function(w){return w.ch===n;}), seen={}, k=0,l=0,tot=0;
  cs.forEach(function(w){ var key=pkey(w); if(seen[key]) return; seen[key]=1; tot++; var b=boxOf(w); if(b>=3) k++; else if(b>=1) l++; });
  return {tot:tot,k:k,l:l,sent:S.filter(function(s){return s.ch===n;}).length+EX.filter(function(s){return s.ch===n;}).length, words:cs.length,
    lines:LN.filter(function(s){return s.ch===n;}).length, made:MK.filter(function(s){return s.ch===n;}).length};
}

function renderSearch(q){

  W.concat(SALL).forEach(function(c){ if(!(norm(c.vi).indexOf(nq)>=0 || c.ko.indexOf(q)>=0)) return; if(isSent(c)){ if(seenS[c.vi]) return; seenS[c.vi]=1; } res.push(c); });

function textbookSents(n){
  /* textbook order: by page, the headline sentence of a section before its examples */
  var arr=S.filter(function(s){return s.ch===n;}).map(function(s,i){return {c:s,k:0,i:i};})
    .concat(EX.filter(function(s){return s.ch===n;}).map(function(s,i){return {c:s,k:1,i:i};}));
  arr.sort(function(a,b){ return (a.c.o||0)-(b.c.o||0) || a.k-b.k || a.i-b.i; });
  return arr.map(function(x){return x.c;});
}
function deckCards(n, deck){
  if(deck==='sent' && chInfo(n).x) return MK.filter(function(s){return s.ch===n;});
  if(deck==='sent'){
    if(view.sfilter==='made') return MK.filter(function(s){return s.ch===n;}).map(function(s,i){return [s,i];}).sort(function(a,b){ return a[0].pp-b[0].pp || (a[0].t<b[0].t?-1:a[0].t>b[0].t?1:0) || a[1]-b[1]; }).map(function(x){return x[0];});
    if(view.sfilter==='core') return S.filter(function(s){return s.ch===n;});
    return textbookSents(n);
  }
  if(deck==='dlg') return LN.filter(function(s){return s.ch===n;});
  return W.filter(function(w){return w.ch===n && w.src===deck;});
}
function filterCards(cards){
  if(view.deck==='sent' || view.deck==='dlg') return cards;

    return true; });
}

/* 문장 만들기: tiles for one short sentence */
var LOWER = (function(){ var o={}; W.concat(SALL).forEach(function(c){ (String(c.vi).match(/[A-Za-zÀ-ɏḀ-ỿ]+/g)||[]).forEach(function(t){ if(t===t.toLowerCase()) o[t]=1; }); }); return o; })();
function tilesOf(c){
  var v=c.vi;

  var body=v.replace(/[.?!…]+$/,'').trim();
  if(/[.?!]/.test(body)) return null;
  var parts=body.split(/\s+/).map(function(t){ return t.replace(/,$/,''); });
  if(parts.length<3 || parts.length>8) return null;
  var f=parts[0], lf=f.toLowerCase(); if(f!==lf && LOWER[lf]) parts[0]=lf;
  return parts;
}
function prevLineOf(c){
  var d=BYID[c.dl]; if(!d) return null; var ls=d.lines, i=ls.indexOf(c);

  return null;
}

  same.concat(other).forEach(function(x){ var v=field==='ko'?kk(x.ko):x.vi; if(out.length<n && !seen[v]){ seen[v]=1; out.push(x); } });
  return out;
}
function toneOptions(c){
  var parts=[], re=/[A-Za-zÀ-ɏḀ-ỿ]+/g, m, txt=c.vi;
  while((m=re.exec(txt))){ if(toneOf(m[0])) parts.push({s:m[0],i:m.index}); }
  if(!parts.length || parts.length>4 || /[가-힣]/.test(txt)) return null;
  var opts={}; opts[txt]=1; var res=[txt], tries=0, ts=['ngang','sac','huyen','hoi','nga','nang'];
  while(res.length<4 && tries<60){ tries++;
    var p=parts[Math.floor(Math.random()*parts.length)], cur=toneOf(p.s), nt=ts[Math.floor(Math.random()*6)]; if(nt===cur) continue;
    var base=stripTone(p.s), nw=placeTone(base, nt); if(p.s[0]===p.s[0].toUpperCase() && p.s[0]!==p.s[0].toLowerCase()) nw=nw.charAt(0).toUpperCase()+nw.slice(1);
    var cand=txt.slice(0,p.i)+nw+txt.slice(p.i+p.s.length); if(!opts[cand]){ opts[cand]=1; res.push(cand); } }

}
function buildQuestions(mode, chs){
  var kind = mode==='sent' ? 'sent' : mode==='build' ? 'build' : mode==='next' ? 'line' : 'word';
  var pool = uniqByKey(poolFor(chs, kind)), qs=[];
  if(mode==='blitz'){ var seen=pool.filter(function(c){var p=prog(c); return p&&p.n;}); pool = seen.length>=8 ? seen : pool; }
  if(mode==='build'){
    var seenV={};
    var cands0 = shuffle(pool.filter(function(c){ if(seenV[c.vi]) return false; seenV[c.vi]=1; return !!tilesOf(c); }));
    /* mostly textbook sentences, a few made ones (they are marked 💡 on screen) */
    var tb=cands0.filter(function(c){return !isMade(c);}), mk=cands0.filter(isMade), pick=tb.slice(0,6).concat(mk.slice(0,2));
    if(pick.length<8) pick=pick.concat(tb.slice(6, 6+8-pick.length));
    if(pick.length<8) pick=pick.concat(mk.slice(2, 2+8-pick.length));
    shuffle(pick).forEach(function(c){ var ans=tilesOf(c), tl=ans.slice(), tries=0; do{ shuffle(tl); tries++; } while(tl.join(' ')===ans.join(' ') && tries<8);
      qs.push({c:c, ans:ans, tiles:tl.map(function(t){return {t:t,used:false};}), pos:0, mist:0, done:false}); });
    return qs;
  }
  if(mode==='next'){
    var cn = shuffle(pool.filter(function(c){ return !!prevLineOf(c); }));

var GEM_MODEL_STORAGE = 'nghe-noi-a1-gemini-model';
function getGemKey(){ try{ return (localStorage.getItem(GEM_KEY_STORAGE)||'').trim(); }catch(e){ return ''; } }
function setGemKey(k){ try{ localStorage.setItem(GEM_KEY_STORAGE, (k||'').trim()); }catch(e){} initAI(); }
function getGemModel(){ try{ return localStorage.getItem(GEM_MODEL_STORAGE)||'gemini-2.5-flash'; }catch(e){ return 'gemini-2.5-flash'; } }
function setGemModel(m){ try{ localStorage.setItem(GEM_MODEL_STORAGE, m); }catch(e){} }

function makeGeminiSample(apiKey){
  function callGem(input, opts, wantJson){
    opts = opts || {};
    var model = getGemModel() || (opts.modelTier==='default' ? 'gemini-2.5-pro' : 'gemini-2.5-flash');
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(apiKey);
    var contents = [];
    if(typeof input === 'string'){
      contents.push({role:'user', parts:[{text:input}]});
    } else if(Array.isArray(input)){
      input.forEach(function(m){
        contents.push({role: m.role==='assistant' ? 'model' : 'user', parts:[{text: String(m.content||'')}]});
      });
    }
    var body = {contents: contents, generationConfig: {temperature: wantJson ? 0.3 : 0.7}};
    if(wantJson) body.generationConfig.responseMimeType = 'application/json';
    return fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
      signal: opts.signal
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){return {};}).then(function(err){
          var msg = (err && err.error && err.error.message) || ('HTTP '+res.status);
          if(res.status===429) throw {code:'rate_limited', message:msg};
          if(res.status===400 || res.status===403) throw {code:'api_key_invalid', message:msg};
          throw {code:'network_error', message:msg};
        });
      }
      return res.json();
    }).then(function(data){
      var cand = data && data.candidates && data.candidates[0];
      var parts = cand && cand.content && cand.content.parts || [];
      var txt = parts.map(function(p){return p.text||'';}).join('').trim();
      if(!txt) throw {code:'empty_completion', message:'Empty response'};
      if(opts.onText) opts.onText({text: txt});
      return {text: txt, truncated: cand && cand.finishReason==='MAX_TOKENS'};
    });
  }
  var fn = function(input, opts){ return callGem(input, opts, false); };
  fn.json = function(input, opts){
    return callGem(input, opts, true).then(function(r){
      var t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}');
      if(a<0 || b<a) throw {code:'invalid_json', message:'no JSON', text:t};
      return JSON.parse(t.slice(a, b+1));
    });
  };
  return fn;
}

/* Built-in Local Smart Tutor Fallback (works 100% offline even without API key) */
function makeLocalFallbackSample(){
  function localReply(input){
    var lastUser = '';
    if(Array.isArray(input)){
      for(var i=input.length-1;i>=0;i--){ if(input[i].role==='user' && input[i].content.indexOf('(Continue')!==0){ lastUser=input[i].content; break; } }
    } else lastUser = String(input||'');
    var c = TK.cur || {upto:state.settings.upto, topic:TK.pref.topic, addr:TK.pref.addr||'anh', rx:tkTopic(TK.pref.topic).rx};
    var addr = c.addr || 'anh';
    var turnCount = c.turns ? c.turns.filter(function(t){return t.r==='ai' && !t.pending;}).length : 0;
    var pool = (c.rx ? RXS : TBS).filter(function(s){ return tkIn(s.ch, c); });
    var topicPool = pool.filter(function(s){ return s.ch === tkTopic(c.topic).ch; });
    if(!topicPool.length) topicPool = pool;
    if(turnCount === 0){
      if(c.topic==='food') return {vi:'Chào '+addr+' ạ. Mời '+addr+' vào quán phở. '+addr.charAt(0).toUpperCase()+addr.slice(1)+' muốn dùng gì ạ?', ko:'안녕하세요. 쌀국수 식당에 들어오세요. 무엇을 드시고 싶으세요?'};
      if(c.topic==='market') return {vi:'Chào '+addr+'. '+addr.charAt(0).toUpperCase()+addr.slice(1)+' muốn mua quả gì ạ?', ko:'안녕하세요. 어떤 과일을 사고 싶으세요?'};
      if(c.topic==='doctor') return {vi:'Chào '+addr+'. '+addr.charAt(0).toUpperCase()+addr.slice(1)+' bị làm sao thế?', ko:'안녕하세요. 어디가 안 좋으세요?'};
      if(c.rx) return {vi:'Dạ, em chào '+addr+' ạ. Rất vui được gặp '+addr+' ạ.', ko:'네, 안녕하세요. 만나서 매우 반가워요.'};
      return {vi:'Chào '+addr+'! Hôm nay '+addr+' có khoẻ không?', ko:'안녕하세요! 오늘 건강히 잘 지내시나요?'};
    }
    var pick = topicPool[(turnCount * 3 + lastUser.length) % topicPool.length] || {vi:'Vâng ạ. Cảm ơn '+addr+' ạ.', ko:'네, 감사합니다.'};
    return {vi: pick.vi, ko: pick.ko};
  }
  var fn = function(input, opts){
    return new Promise(function(resolve){
      setTimeout(function(){
        var r = localReply(input);
        var txt = 'VI: '+r.vi+'\nKO: '+r.ko;
        if(opts && opts.onText) opts.onText({text: txt});
        resolve({text: txt, truncated: false});
      }, 350);
    });
  };
  fn.json = function(input, opts){
    return new Promise(function(resolve){
      setTimeout(function(){
        var c = TK.cur || {upto:state.settings.upto, rx:tkTopic(TK.pref.topic).rx};
        var pool = (c.rx ? RXS : S).filter(function(s){ return tkIn(s.ch, c); });
        if(String(input).indexOf('"replies"')>=0 || String(input).indexOf('"options"')>=0){
          var picks = shuffle(pool.slice()).slice(0,3).map(function(s){ return {vi:s.vi, ko:s.ko}; });
          resolve({replies:picks, options:picks, note:'오프라인 기본 문장 추천 모드예요. Gemini API 키를 연결하면 내 한국어 문장을 즉시 맞춤 번역해 줘요.'});
        } else {
          var d = tkData(c.upto, c.rx);
          var sIds = ['s1','s2','s3'].slice(0, Math.min(3, d.evalSents.length));
          var wIds = ['w1','w2','w3','w4'].slice(0, Math.min(4, d.evalWords.length));
          resolve({
            summary: '오프라인 연습 모드로 대화를 마쳤어요. 프리토킹 설정에서 Gemini API 키를 입력하면 내 문장 하나하나에 대한 정밀 문법·성조 교정을 받을 수 있어요.',
            scores: {vocab:{score:4,note:'배운 단어를 잘 활용했어요.'}, grammar:{score:4,note:'기본 문형을 잘 지켰어요.'}, spelling:{score:4,note:'성조 표기에 유의하며 연습해 보세요.'}, fluency:{score:4,note:'자연스럽게 대화를 이어갔어요.'}, task:{score:4,note:'주제에 맞게 잘 응답했어요.'}},
            strengths: ['설정된 과 범위 안에서 대화를 끝까지 이어갔어요.'],
            fixes: [],
            sentences: sIds,
            words: wIds,
            extra: [],
            next: '아래 추천 문장과 단어를 소리 내어 읽으며 복습해 보세요.'
          });
        }
      }, 450);
    });
  };
  return fn;
}

var SAMPLE=null, SAMPLE_STATE='ready', AI_MODE='local';
function initAI(){
  var k = getGemKey();
  if(k){
    SAMPLE = makeGeminiSample(k);
    SAMPLE_STATE = 'ready';
    AI_MODE = 'gemini';
  } else if(window.claude && typeof window.claude.use==='function'){
    SAMPLE_STATE = 'checking';
    window.claude.use('sample').then(function(f){
      if(f){ SAMPLE=f; SAMPLE_STATE='ready'; AI_MODE='claude'; }
      else { SAMPLE=makeLocalFallbackSample(); SAMPLE_STATE='ready'; AI_MODE='local'; }
      tkRefresh();
    }, function(){
      SAMPLE=makeLocalFallbackSample(); SAMPLE_STATE='ready'; AI_MODE='local'; tkRefresh();
    });
  } else {
    SAMPLE = makeLocalFallbackSample();
    SAMPLE_STATE = 'ready';
    AI_MODE = 'local';
  }
  tkRefresh();
}

var PARTNERS={trang:{vi:'Trang', ko:'짱', en:'Trang, a cheerful young Vietnamese woman from Hanoi'},
              hung:{vi:'Hùng', ko:'훙', en:'Hùng, a friendly young Vietnamese man from Hanoi'}};
/* in the research topics the same two names play migrant workers (invented people) */
var RPERSONA={trang:{vi:'Trang', ko:'짱', g:'여', en:'Trang, a Vietnamese woman in her late twenties'},
              hung:{vi:'Hùng', ko:'훙', g:'남', en:'Hùng, a Vietnamese man in his late twenties'}};
function tkTopic(k){ return TOPICS.filter(function(t){return t.k===k;})[0] || TOPICS[0]; }
function tkName(c){ var tp=tkTopic(c.topic); if(tp.rx) return (RPERSONA[c.partner]||RPERSONA.trang).vi; return tp.role ? tp.role.vi : (PARTNERS[c.partner]||PARTNERS.trang).vi; }
/* is a word from chapter ch inside this conversation's range? (textbook 1~upto, plus Bài 14~16 in research talks) */
function tkIn(ch, c){ return ch<=c.upto || (!!c.rx && ch>=14); }
/* every word used in Bài 14~16 counts as learned in a research talk (e.g. dạ, thời gian come from Bài 13·9) */
var RXTOK=null;
function rxTok(){ if(RXTOK) return RXTOK; RXTOK={}; W.filter(isX).concat(RXS).forEach(function(x){ toksOf(x.vi).forEach(function(t){ RXTOK[t]=1; }); }); return RXTOK; }
function tkInTok(t, ch, c){ return (ME.vi && t===ME.vi.toLowerCase()) || (ch!==undefined && tkIn(ch, c)) || (!!c.rx && !!rxTok()[t]); }
function tkRangeText(c){ return '1~'+c.upto+'과'+(c.rx?' + 연구 표현':''); }

/* ---- words and tokens ---- */
var LETRE=/[A-Za-zÀ-ɏḀ-ỿ]+/g;
function toksOf(text){ return (String(text).match(LETRE)||[]).map(function(t){return t.toLowerCase();}); }
function expandParen(x){ var m=x.match(/\(([^()]*)\)/); if(!m) return [x]; var a=x.slice(0,m.index), b=x.slice(m.index+m[0].length); return expandParen(a+m[1]+b).concat(expandParen(a+b)); }
function variantsJS(vi){
  if(vi==='Anh') return ['tiếng anh','người anh','nước anh'];
  var v=String(vi).replace(/[가-힣]+/g,' ').replace(/\+/g,' '), outs=[];
  expandParen(v).forEach(function(x){ x.split(/\s+\/\s+|,\s*/).forEach(function(y){ var m=y.match(/(\S+)\/(\S+)/);
    if(m){ outs.push(y.replace(m[0], m[1])); outs.push(y.replace(m[0], m[2])); } else outs.push(y); }); });
  var o=[]; outs.forEach(function(s){ var t=toksOf(s).join(' '); if(t && o.indexOf(t)<0) o.push(t); }); return o;
}
var UNITS=null, UMAX=1, TOKCH=null;
function tkUnits(){
  if(UNITS) return UNITS; UNITS={};
  W.forEach(function(w){ variantsJS(w.vi).forEach(function(u){ (UNITS[u]=UNITS[u]||[]).push(w); UMAX=Math.max(UMAX, u.split(' ').length); }); });
  return UNITS;
}
function tokCh(){
  if(TOKCH) return TOKCH; TOKCH={};
  function add(t, ch){ if(!(t in TOKCH) || TOKCH[t]>ch) TOKCH[t]=ch; }
  W.forEach(function(w){ variantsJS(w.vi).forEach(function(u){ u.split(' ').forEach(function(t){ add(t, w.ch); }); }); });
  SALL.forEach(function(s){ toksOf(s.vi).forEach(function(t){ add(t, s.ch); }); });
  return TOKCH;
}
function segmentVi(text){
  var U=tkUnits(), ts=toksOf(text), out=[], i=0;
  while(i<ts.length){
    var hit=null;
    for(var L=Math.min(UMAX, ts.length-i); L>=1; L--){ var k=ts.slice(i,i+L).join(' '); if(U[k]){ hit=k; break; } }
    if(hit){ out.push({u:hit, words:U[hit]}); i+=hit.split(' ').length; } else { out.push({u:ts[i], words:null}); i++; }
  }
  return out;
}
/* Vietnamese with tone colours; words outside the conversation's range are underlined with dots.
   c = the conversation (upto, rx) */
function tkViHTML(text, c){
  var re=/[A-Za-zÀ-ɏḀ-ỿ]+/g, m, out='', last=0, tc=tokCh();
  text=String(text||'');
  while((m=re.exec(text))){
    var tok=m[0], low=tok.toLowerCase(), pre=text.slice(0, m.index);
    var initial = !/[A-Za-zÀ-ɏḀ-ỿ]/.test(pre) || /[.?!:]["”’)]?\s*$/.test(pre);
    var proper = tok!==low && !initial && !(low in tc);
    var ch=tc[low], oor = !proper && tok.length>1 && !tkInTok(low, ch, c);
    var tn=toneOf(tok), span=tn?'<span class="t t-'+tn+'">'+esc(tok)+'</span>':esc(tok);
    out+=esc(text.slice(last, m.index))+(oor?'<span class="oor" title="'+(ch!==undefined?(ch>13?ch+'과 💡 연구 표현':ch+'과에서 배우는 말'):'교재 외')+'">'+span+'</span>':span);
    last=m.index+tok.length;
  }
  return out+esc(text.slice(last));
}
function tkWordsHTML(text, c){
  var tc=tokCh(), seen={}, rows=[];
  segmentVi(text).forEach(function(sg){
    if(seen[sg.u]) return; seen[sg.u]=1;
    if(sg.words){
      var ms=[], mk={};
      sg.words.slice().sort(function(a,b){return a.ch-b.ch;}).forEach(function(w){ if(mk[w.ko]) return; mk[w.ko]=1; ms.push(w); });
      var inU = !!c.rx && sg.u.split(' ').every(function(t){ return rxTok()[t]; });
      rows.push('<div><span class="vi">'+toneHTML(sg.words[0].vi)+'</span> '+ms.slice(0,3).map(function(w){ return esc(w.ko)+' <span class="faint">'+w.ch+'과'+(isX(w)?' 💡':'')+(!tkIn(w.ch, c) && !inU?' · 범위 밖':'')+'</span>'; }).join(' / ')+'</div>');
    } else if(tc[sg.u]===undefined){
      rows.push('<div><span class="vi oor">'+esc(sg.u)+'</span> <span class="faint">교재 외</span></div>');
    } else if(!tkInTok(sg.u, tc[sg.u], c)){
      rows.push('<div><span class="vi oor">'+esc(sg.u)+'</span> <span class="faint">'+tc[sg.u]+'과 문장에 나와요 · 범위 밖</span></div>');
    }
  });
  return rows.join('') || '<div class="faint">표시할 단어가 없어요.</div>';
}

/* ---- range data for prompts ---- */
var TKC={};
function tkData(n, rx){
  var key=n+(rx?'r':''); if(TKC[key]) return TKC[key];
  var known=W.filter(function(w){return w.ch<=n && !isX(w);}), viList=[], wt={};
  known.forEach(function(w){ var v=w.vi.replace(/[가-힣+]+/g,' ').replace(/\s+/g,' ').trim(); if(v && viList.indexOf(v)<0) viList.push(v); toksOf(w.vi).forEach(function(t){ wt[t]=1; }); });
  var other=[];
  TBS.forEach(function(s){ if(s.ch>n) return; (String(s.vi).match(LETRE)||[]).forEach(function(t){ if(t===t.toLowerCase() && !wt[t] && other.indexOf(t)<0) other.push(t); }); });
  var patterns=S.filter(function(s){return s.ch<=n;}).map(function(s){ return 'Bài '+s.ch+': '+s.vi; });
  var ew=[], ek={}; W.forEach(function(w){ if(isX(w) ? !rx : w.ch>Math.min(13,n+1)) return; var k=w.vi+'|'+w.ko; if(ek[k]) return; ek[k]=1; ew.push(w); });
  var es=[], sk={}; TBS.concat(rx?RXS:[]).forEach(function(s){ if((!isX(s) && s.ch>n) || sk[s.vi]) return; sk[s.vi]=1; es.push(s); });
  var rxList=[], rxPatterns=[];
  if(rx){
    W.forEach(function(w){ if(isX(w) && rxList.indexOf(w.vi)<0) rxList.push(w.vi); });
    MK.forEach(function(s){ if(isX(s)) rxPatterns.push('Bài '+s.ch+': '+s.vi); });
  }
  return (TKC[key]={viList:viList, other:other, patterns:patterns, evalWords:ew, evalSents:es, rxList:rxList, rxPatterns:rxPatterns});
}
function tkLevel(c){
  var d=tkData(c.upto, c.rx);
  return 'The learner is a Korean adult studying Vietnamese with the textbook "Tiếng Việt Nghe Nói A1" (northern Vietnamese) and has finished chapters 1-'+c.upto+' only.'+
    (c.rx?' The learner is also a cultural anthropologist who studies Vietnamese migrant workers in Korea, and is learning fieldwork Vietnamese (Bài 14-16, written for this learner, not in the textbook).':'')+'\n\n'+
    'Words the learner knows (chapters 1-'+c.upto+'):\n'+d.viList.join(', ')+'\n\n'+
    (d.other.length?'Other words that appear in the textbook sentences of chapters 1-'+c.upto+':\n'+d.other.join(', ')+'\n\n':'')+
    'Model sentences from the textbook, chapters 1-'+c.upto+':\n'+d.patterns.join('\n')+
    (c.rx?'\n\nFieldwork words the learner is learning (Bài 14-16):\n'+d.rxList.join(', ')+'\n\nFieldwork model sentences (Bài 14-16):\n'+d.rxPatterns.join('\n'):'');
}
function tkRules(c){
  var tp=tkTopic(c.topic), who, extra=[];
  if(tp.rx){

var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var STT = {rec: null, active: false, baseText: '', interimText: ''};
function sttSyncUI(){
  var mb = document.getElementById('tk-mic-btn');
  if(mb) mb.classList.toggle('rec', !!STT.active);
  var rb = document.getElementById('tk-rec-bar');
  if(rb) rb.innerHTML = STT.active ? '<div class="rec-bar"><span>🔴 베트남어 듣는 중… 천천히 말씀하세요 (다 말한 뒤 보내기)</span><button class="btn small" data-act="talk-mic">멈춤</button></div>' : '';
}
function sttStop(){
  STT.active = false;
  if(STT.rec){ try{ STT.rec.stop(); }catch(e){} }
  sttSyncUI();
}
function sttToggle(){
  if(STT.active){ sttStop(); return; }
  if(!SpeechRec){
    toast('이 브라우저는 직접 음성 인식을 지원하지 않아요. 키보드의 🎤 받아쓰기 버튼을 눌러 말씀해 보세요.');
    var ta0 = document.getElementById('tk-input'); if(ta0) ta0.focus();
    return;
  }
  try{ if(window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.cancel(); }catch(e){}
  var ta = document.getElementById('tk-input');
  STT.baseText = (ta ? ta.value : (TK.draft||'')).trim();
  if(STT.baseText) STT.baseText += ' ';
  STT.interimText = '';
  var rec = new SpeechRec();
  rec.lang = 'vi-VN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = function(ev){
    var fin = '', inter = '';
    for(var i = ev.resultIndex; i < ev.results.length; i++){
      var tr = ev.results[i][0].transcript;
      if(ev.results[i].isFinal) fin += tr + ' ';
      else inter += tr;
    }
    if(fin) STT.baseText += fin;
    STT.interimText = inter;
    var combined = (STT.baseText + STT.interimText).replace(/\s+/g, ' ');
    TK.draft = combined;
    var el = document.getElementById('tk-input');
    if(el){ el.value = combined; tkGrow(el); }
  };
  rec.onerror = function(ev){
    var er = ev && ev.error;
    if(er === 'not-allowed' || er === 'service-not-allowed'){
      STT.active = false; sttSyncUI();
      toast('마이크 권한을 허용해 주세요.');
    } else if(er !== 'no-speech' && er !== 'aborted'){
      STT.active = false; sttSyncUI();
    }
  };
  rec.onend = function(){
    /* Keep listening if user paused to think and hasn't pressed Stop or Send! */
    if(STT.active && view.sheet==='talk' && TK.view==='chat'){
      try{ rec.start(); return; }catch(e){}
    }
    STT.active = false;
    sttSyncUI();
  };
  STT.rec = rec;
  STT.active = true;
  sttSyncUI();
  try{ rec.start(); }catch(e){ STT.active = false; sttSyncUI(); toast('마이크를 시작하지 못했어요.'); }
}

function tkClean(o, b){
  function str(x){ return typeof x==='string' ? x.trim() : ''; }

  ['vocab','grammar','spelling','fluency','task'].forEach(function(k){
    var s=o && o.scores && o.scores[k], v=(s && typeof s==='object') ? s.score : s; v=Math.round(+v);
    r.scores[k]={s:(v>=1 && v<=5) ? v : null, n:str(s && s.note)};

  arr(o && o.fixes).slice(0,6).forEach(function(f){ if(f && str(f.better)) r.fixes.push({turn:+f.turn||0, you:str(f.you), better:str(f.better), why:str(f.why), type:str(f.type)}); });
  arr(o && o.sentences).forEach(function(id){ var x=b.smap[String(id).trim()]; if(x && r.sents.indexOf(x.id)<0) r.sents.push(x.id); });
  arr(o && o.words).forEach(function(id){ var x=b.wmap[String(id).trim()]; if(x && r.words.indexOf(x.id)<0) r.words.push(x.id); });
  arr(o && o.extra).slice(0,3).forEach(function(x){ if(x && str(x.vi)) r.extra.push({vi:str(x.vi), ko:str(x.ko), why:str(x.why)}); });

}
